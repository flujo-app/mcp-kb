# hadolint configuration — the Dockerfile linter run by quality.yml.
#
# quality.yml fails on `warning` and above, so an ignore here is a deliberate
# decision to accept a rule's risk, not a way to quiet a nuisance. One of them,
# about version pinning, because the pin already exists somewhere this linter
# cannot see.
ignored:

# DL3013 — "pin versions in pip install".
#
# The pins are in pyproject.toml, and `builder` installs from a requirement list
# generated out of it by scripts/requirements.py. Naming versions in the
# Dockerfile too would create a second place to update and a new way for the two
# to disagree silently.
#
# The one unpinned install is `--upgrade pip`, and it never ships: `builder`
# runs `pip uninstall --yes pip` before the venv is copied, so the runner
# receives a venv with no pip in it.
- DL3013

failure-threshold: warning
