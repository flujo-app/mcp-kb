apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-school
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      # The control-plane nodes carry no taint in this cluster, so without this
      # the scheduler will happily place this pod on an etcd/master node — it
      # landed on berry on the first rollout. required, not preferred: there is
      # no reason for a stateless skills server to ever sit on a master.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      volumes:
      # index.json, at CACHE_DIR — disposable: a restart rebuilds it from the
      # sources, which is also what a restart is for. Sized so a runaway
      # source cannot fill the node.
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: mcp-school
        image: kubed/mcp-school
        # Always, because kustomization.yaml currently floats on :latest — with
        # IfNotPresent a node keeps serving whatever layer it cached first.
        # Once publish.yml pins a semver this is just a cheap registry check.
        imagePullPolicy: Always
        # No auth by design: every skill served here is public markdown already
        # on GitHub, and the server has no write path and no credentials.
        # A config that lists fewer sources hard-scopes an instance — deploy a
        # second copy with a config naming only n8n to give an n8n agent a
        # catalogue it cannot widen. The baked-in image config serves everything.
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: cache
          mountPath: /var/cache/mcp-school
        - name: tmp
          mountPath: /tmp
        # The skills are baked into the image and everything else here is
        # read-only — except CACHE_DIR, index.json, which is this process's
        # one write, and the reason for the cache volume above.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
        livenessProbe:
          httpGet:
            path: /health
            port: http
