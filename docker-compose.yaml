# Local build + smoke test for the kubed/skills-mcp image. `docker buildx bake`
# reads the build block below -- that is what CI runs, so the tag list and
# x-bake settings here are the release configuration, not just local convenience.
services:
  skills-mcp:
    image: &image kubed/skills-mcp:latest
    build:
      context: .
      target: runner
      args:
        PY_VERSION: ${PY_VERSION:-3.14}
      tags:
      - *image
      - kubed/skills-mcp:${GIT_SHA:-latest}
      - kubed/skills-mcp:${GIT_REF:-latest}
      - kubed/skills-mcp:${GIT_TAG:-latest}
      x-bake:
        platforms:
        - linux/amd64
        - linux/arm64
        cache-to: type=gha,mode=max,scope=skills-mcp
        cache-from: type=gha,scope=skills-mcp
    container_name: skills-mcp
    restart: no
    ports:
    - 8000:8000
    environment:
      TRANSPORT: ${TRANSPORT:-http}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
