[project]
name = "mcp-school"
description = "A resource and prompt gateway for MCP: serves skills, prompts and other agent material from many sources"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10.0"
keywords = ["mcp", "skills", "agent-skills", "fastmcp", "ai"]
license-files = ["LICENSE"]
# One entry per interpreter CI actually sweeps, so the metadata and
# .github/workflows/test.yml make the same claim. A bare "Python :: 3" tells an
# installer nothing it can act on.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
authors = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
maintainers = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
dependencies = [
  "fastmcp>=4.0.0,<5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
build = [
  "setuptools_scm",
  "build",
  "wheel",
  # Validates the built distribution's metadata before it can become a rejected
  # upload to a package index — the failure that otherwise only appears at
  # publish time. Used by .github/workflows/package.yml.
  "twine",
]
test = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "uvicorn",
  # tests/test_packaging.py reads pyproject.toml, and tomllib is 3.11+. It
  # arrives with pytest today; declared because a test that imports it should.
  "tomli; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/kubed-io"
Repository = "https://github.com/kubed-io/mcp-school"
Issues = "https://github.com/kubed-io/mcp-school/issues"
Changelog = "https://github.com/kubed-io/mcp-school/blob/main/CHANGELOG.md"

[project.scripts]
mcp-school = "mcp_school.main:main"

[tool.setuptools_scm]

[tool.setuptools]
packages = ["mcp_school"]

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "unit: mark a test as a unit test",
  "integration: mark a test as an integration test",
]

[tool.ruff]
# The oldest interpreter supported, so ruff flags what would break there.
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # constructs a newer supported Python does better
  "B",        # bugbear
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PIE",      # small dead weight
  "PTH",      # pathlib over os.path
  "RET",      # return-flow noise
  "RUF",      # ruff's own, incl. RUF100 for noqas that stopped applying
  "BLE",      # blind except: each one must carry a noqa saying why
]

[tool.ruff.lint.per-file-ignores]
# A long, specific assertion message is the point of a test.
"tests/*" = ["E501"]
