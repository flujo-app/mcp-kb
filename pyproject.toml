[project]
name = "mcp-school"
description = "A resource and prompt gateway for MCP: serves skills, prompts and other agent material from many sources"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
keywords = ["mcp", "skills", "agent-skills", "fastmcp", "ai"]
license-files = ["LICENSE"]
# One entry per interpreter CI actually sweeps, so the metadata and
# .github/workflows/test.yml make the same claim. A bare "Python :: 3" tells an
# installer nothing it can act on.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
authors = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
maintainers = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
dependencies = [
  "fastmcp>=4.0.0,<5",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  # git sources. pygit2 bundles libgit2, so the image needs no git binary and
  # no build toolchain; fsspec's GitFileSystem is what exports a tree out of a
  # bare clone without a working copy.
  "fsspec>=2024.5",
  # 1.19 is where Remote.list_heads arrives — 1.15-1.18 have ls_remotes only,
  # and a lower floor resolves to one of those and dies with an AttributeError.
  # It is also the first release to require 3.11, which sets requires-python.
  "pygit2>=1.19",
  # webdav sources. The fsspec extra is what gives WebdavFileSystem; webdav4
  # brings httpx<1, which coexists with FastMCP's httpx2. 0.11 is the version
  # the suite is actually run against -- a tested floor, not a known-minimum:
  # nothing here can verify when ls(detail=True) started passing the ETag
  # through, and CI resolves to the newest either way. Lower it only with a
  # run that proves the lower one works.
  "webdav4[fsspec]>=0.11",
]

[project.optional-dependencies]
build = [
  "setuptools_scm",
  "build",
  "wheel",
  # Validates the built distribution's metadata before it can become a rejected
  # upload to a package index — the failure that otherwise only appears at
  # publish time. Used by .github/workflows/package.yml.
  "twine",
]
test = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "uvicorn",
  # tests/test_packaging.py builds a wheel out of a checkout with no .git and
  # imports from it — the one way to catch a package the metadata forgot.
  "build",
  "setuptools_scm",
  # tests/test_refresh.py drives the ASGI app directly. FastMCP pulls in httpx2,
  # not httpx, so this has to be declared or the suite only passes where
  # something else happened to install it.
  "httpx",
  # tests/webdav_server.py runs a real WebDAV server that demands Basic auth —
  # imported directly, so declared here or CI fails where the pod passed.
  "wsgidav",
  "cheroot",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/kubed-io"
Repository = "https://github.com/kubed-io/mcp-school"
Issues = "https://github.com/kubed-io/mcp-school/issues"
Changelog = "https://github.com/kubed-io/mcp-school/blob/main/CHANGELOG.md"

[project.scripts]
mcp-school = "mcp_school.main:main"

[tool.setuptools_scm]

[tool.setuptools]
# Every package, spelled out. setuptools takes this list literally and implies
# no subpackage from it; a subpackage arrives anyway only because
# setuptools_scm installs a file finder that sweeps everything under version
# control, and a build from an exported tarball has no such checkout to sweep.
# tests/test_packaging.py holds this list to the tree and then proves the built
# wheel imports with no .git present.
packages = ["mcp_school", "mcp_school.sources"]

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "unit: mark a test as a unit test",
  "integration: mark a test as an integration test",
]

[tool.ruff]
# The oldest interpreter supported, so ruff flags what would break there.
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # constructs a newer supported Python does better
  "B",        # bugbear
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PIE",      # small dead weight
  "PTH",      # pathlib over os.path
  "RET",      # return-flow noise
  "RUF",      # ruff's own, incl. RUF100 for noqas that stopped applying
  "BLE",      # blind except: each one must carry a noqa saying why
]

[tool.ruff.lint.per-file-ignores]
# A long, specific assertion message is the point of a test.
"tests/*" = ["E501"]
