# Dependabot version updates (security updates are toggled in repo settings,
# not in this file). One entry per package manager active in the repo.
#
# House rules:
# - Weekly cadence: enough to stay current without spamming the queue.
# - Grouped minor + patch per ecosystem; majors stay separate for review.
# - A one-week cooldown so a release that gets yanked, or has its first
#   post-publish advisory filed against it, is pulled before it reaches us.
# - Commit prefix is distinct per ecosystem so the merge queue reads cleanly.
#
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:

# GitHub Actions: keeps every `uses:` pin across workflows current.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  # skips the pr.yml changelog gate — dependency bumps still land in release
  # notes via version-bump's PR-based generation.
  - no changelog
  commit-message:
    prefix: ci(deps)
  cooldown:
    # github-actions is not semver-versioned, so only default-days is valid here.
    default-days: 7
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch

# Python: fastmcp is the only runtime dependency, and the whole server is a
# thin wrapper over its skills provider — a major bump is a real review.
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - python
  - no changelog
  commit-message:
    prefix: deps(pip)
  cooldown:
    default-days: 7
  groups:
    pip-minor-patch:
      update-types:
      - minor
      - patch

# Docker: tracks the python base image in the Dockerfile.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - docker
  - no changelog
  commit-message:
    prefix: deps(docker)
  cooldown:
    default-days: 7
  groups:
    docker-minor-patch:
      update-types:
      - minor
      - patch

# NOTE: the skill sources in skills.toml are NOT tracked here. Dependabot has no
# ecosystem for a hand-rolled manifest, so bumping those pins is the "Update
# Skills" workflow's job (.github/workflows/update-skills.yml).
