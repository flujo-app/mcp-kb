name: 📸 Image Builder

# Context-driven image build:
#   push: main          push :main + :latest          → test :latest in-cluster
#   workflow_dispatch   manual build (push toggle)
#   workflow_call       called by publish.yml with a version tag — checks out
#                       that tag and pushes :vX.Y.Z (stable, pin this to deploy)
#
# Deliberately NOT run on pull_request. A ~7-minute two-arch build is most of a
# pull request's total wait, for a signal that almost never differs from what the
# merge build gives — and the merge build is the one whose output anyone actually
# pulls. The Dockerfile is not unguarded on a PR: quality.yml lints it with
# hadolint, package.yml builds and installs the wheel the image wraps, and
# test.yml runs lint + unit tests, so a break in the part that is ours is caught
# in seconds instead of minutes.
#
# What remains uncovered is the skill fetch: a bad `ref` or `path` in skills.toml
# only fails here, on merge to main. Run `python scripts/fetch_skills.py` by hand
# when touching the manifest.
#
# There is deliberately NO `push: tags` trigger. Releases don't rely on a tag
# push triggering a build; publish.yml calls this workflow (workflow_call) so the
# image is on Docker Hub BEFORE the GitHub Release is cut.
#
# This workflow only ever builds and pushes the image — it does NOT touch the
# deployed tag. Pinning kustomization.yaml is publish.yml's job, and it only ever
# writes a semver, so main always carries a stable, deployable version.

on:
  push:
    branches: [main]
    paths:
    - Dockerfile
    - docker-compose.yaml
    - pyproject.toml
    - .github/workflows/image.yml
    - kubed/**
    - skills.toml
    - scripts/fetch_skills.py
  workflow_dispatch:
    inputs:
      push:
        description: Push to registry
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        description: Git tag to check out and stamp the image with (empty = current ref)
        type: string
        required: false
        default: ''
      push:
        description: Push to registry
        type: boolean
        required: false
        default: false

# Serialize image builds on the same branch: a new run waits for any in-flight
# one instead of racing it (binfmt/buildx cache reservations collide otherwise).
# cancel-in-progress stays false so queued runs are NOT killed.
concurrency:
  group: image-${{ github.ref }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # true only for a real registry push: merge to main, or a dispatch/publish
      # with push=true. Gates the GCP auth/creds steps and the environment below,
      # so PR/dry builds never touch GCP or a protected env.
      PUSH: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'true' || 'false' }}
    environment:
      name: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'dockerhub' || '' }}
      url: https://hub.docker.com/r/kubed/skills-mcp
    steps:

    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        # publish.yml passes the version tag to lock the build to the released
        # commit; empty for every other event (checks out the triggering ref).
        ref: ${{ inputs.tag }}
        # setuptools_scm derives the version from git history, not just HEAD.
        fetch-depth: 0

    - name: Authenticate to GCP
      if: env.PUSH == 'true'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: github@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

    - name: Get Docker Hub Credentials
      id: secrets
      if: env.PUSH == 'true'
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: |-
          dockerhub:${{ vars.GCP_PROJECT }}/dockerhub

    # GIT_TAG is the semantic bake tag: the version on a release (workflow_call),
    # else :latest on a main build.
    - name: Resolve image tag
      shell: bash
      env:
        CALL_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$CALL_TAG" ]; then
          echo "GIT_TAG=$CALL_TAG" >> "$GITHUB_ENV"
        else
          echo "GIT_TAG=latest" >> "$GITHUB_ENV"
        fi

    - name: Build and Push
      uses: kubed-io/actions/build-image@main
      with:
        push: ${{ env.PUSH }}
        # Short-circuit before fromJson when not pushing (secrets step skipped →
        # empty output), so the expression never parses an empty string.
        username: ${{ env.PUSH == 'true' && fromJson(steps.secrets.outputs.dockerhub).username || '' }}
        password: ${{ env.PUSH == 'true' && fromJson(steps.secrets.outputs.dockerhub).password || '' }}
        repository: kubed/skills-mcp
