name: 🧬 Publish Version

# Manual, intentional release. Each job owns exactly one thing and hands the next
# a clean input, ordered so nothing outward-facing happens until every artifact
# it refers to already exists:
#
#   test    → the full 3.10 → 3.14 matrix. A release is the one moment the
#             compatibility sweep has to be green, so it gates everything below.
#   version → pin kustomization.yaml to the version we're about to cut, roll
#             CHANGELOG [Unreleased], commit + tag on main
#   image   → check out that tag and build+push kubed/skills-mcp:<tag>
#   package → check out that tag and build the sdist + wheel → GHA artifact
#   release → download the package artifact and cut the GitHub Release
#
# `release` runs last and needs no source checkout: it is pure artifact plus
# secrets. That ordering is the point — the image is on Docker Hub and the
# distribution is built BEFORE the Release exists, so the Release never links to
# a tarball or an image tag that was never produced.
#
# The deploy pin happens in `version`, before the tag is created, so the tag's
# tree already points at its own image — check out vX.Y.Z and the manifest says
# vX.Y.Z. That means computing the version first (a version-bump dry run) and
# pinning with it.
#
# This is the ONLY workflow that writes the deployed tag, and it only ever writes
# a semver — so main always sits on a stable, deployable version. image.yml just
# builds images. To run something unreleased, point newTag at :main or :latest.
#
# Run once with push=false (dry run: runs the tests, computes the next version,
# and builds both the image and the package without pushing anything) then
# push=true to actually cut the release. A failed build after a successful tag
# strands a tag on a nonexistent image, which is exactly what the dry run buys.
#
# Auth for the version job: tokenless WIF → GCP Secret Manager → the kubed.io
# GitHub App creds. The App token is what lets version-bump commit to protected
# main and create the tag.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Version to bump to
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
        - premajor
        - preminor
        - prepatch
      push:
        description: Push changes and create release
        default: false
        type: boolean

permissions:
  # contents: write because the version job pins the deploy tag — bump-image
  # commits kustomization.yaml back to main. This is the ONLY place the deployed
  # tag is written, and it's always a semver.
  contents: write
  id-token: write   # GCP workload-identity federation

jobs:

  # The compatibility sweep. Gates everything: a release is the one moment every
  # interpreter pyproject claims has to be verified, and the cheapest place to
  # find out otherwise is before a tag exists.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      release-notes: ${{ steps.bump.outputs.release-notes }}
    steps:

    - name: Validate Branch
      if: inputs.push
      env:
        REF: ${{ github.ref_name }}
      run: |
        if [[ "$REF" != "main" ]]; then
          echo "::error::Releases can only be pushed from main. Current ref: $REF"
          exit 1
        fi

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: github@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

    # github-app = kubed.io app creds (JSON: github_app_client_id /
    # github_app_private_key) pushed by apps/github/providers/gcp.
    - name: Get secrets
      id: secrets
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: |-
          github_app:${{ vars.GCP_PROJECT }}/github-app

    - name: Mint kubed.io app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ fromJson(steps.secrets.outputs.github_app).github_app_client_id }}
        private-key: ${{ fromJson(steps.secrets.outputs.github_app).github_app_private_key }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    # Compute the next version WITHOUT changing anything, so we have it in hand
    # before pinning the manifest to it.
    - name: Compute next version
      id: next
      uses: duplocloud/version-bump@main
      with:
        version: ${{ inputs.action }}
        push: false
        token: ${{ steps.app-token.outputs.token }}

    # Point the kustomization at the version we're about to cut, so the tag's
    # tree already references its own image. bump-image commits + pushes this to
    # main itself, immediately before the tag commit below.
    - name: Pin deploy tag to the new version
      if: inputs.push
      uses: kubed-io/actions/bump-image@main
      with:
        file: kustomization.yaml
        tag: ${{ steps.next.outputs.tag }}

    - name: Bump Version
      id: bump
      uses: duplocloud/version-bump@main
      with:
        version: ${{ steps.next.outputs.tag }}
        push: ${{ inputs.push }}
        token: ${{ steps.app-token.outputs.token }}

  # Build + push the image at the freshly tagged commit. On a dry run there is no
  # tag, so it builds the current ref without pushing (proves it still builds).
  image:
    name: Publish Image
    needs: version
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.push && needs.version.outputs.tag || '' }}
      push: ${{ inputs.push }}

  # Build the distribution at the freshly tagged commit, so the artifact the
  # Release carries was built from exactly the released tree. On a dry run there
  # is no tag, so it packages the current ref — which still proves it builds.
  package:
    name: Package
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.push && needs.version.outputs.tag || '' }}

  release:
    name: Release
    needs:
    - version
    - image
    - package
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release on the existing tag
    steps:

    # No checkout: this job is pure artifact plus secrets. What it publishes is
    # the distribution the package job already built and tested, byte for byte.
    - name: Download Package
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.package.outputs.package }}
        path: dist

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        name: ${{ needs.version.outputs.tag }}
        tag_name: ${{ needs.version.outputs.tag }}
        prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        files: |
          dist/${{ needs.package.outputs.sdist }}
          dist/${{ needs.package.outputs.wheel }}
        body: |
          [![Image Builder](${{ github.server_url }}/${{ github.repository }}/actions/workflows/image.yml/badge.svg)](${{ github.server_url }}/${{ github.repository }}/actions/workflows/image.yml)

          Image: `kubed/skills-mcp:${{ needs.version.outputs.tag }}`

          ${{ needs.version.outputs.release-notes }}

    - name: Summary
      env:
        TAG: ${{ needs.version.outputs.tag }}
        RELEASE_NOTES: ${{ needs.version.outputs.release-notes }}
      run: |
        {
          echo "## Publish"
          echo ""
          echo "- **Tag**: $TAG"
          echo "- **Image**: kubed/skills-mcp:$TAG"
          echo ""
          echo "### Release Notes"
          echo ""
          echo "$RELEASE_NOTES"
        } >> "$GITHUB_STEP_SUMMARY"
