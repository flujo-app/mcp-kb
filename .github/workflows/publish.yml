name: 🧬 Publish Version

# Manual, intentional release. Each job owns exactly one thing and hands the next
# a clean input, ordered so nothing outward-facing happens until every artifact
# it refers to already exists:
#
#   test    → the full 3.11 → 3.14 matrix. A release is the one moment the
#             compatibility sweep has to be green, so it gates everything below.
#   version → roll CHANGELOG [Unreleased], commit + tag on main. The ONLY job
#             that writes a file or a tag; it emits the tag consumed downstream.
#   image   → check out that tag and push kubed/mcp-kb:<tag>
#   package → check out that tag and build the sdist + wheel → GHA artifact
#   wiki    → regenerate and publish the wiki from that tag
#   release → download the package artifact and cut the GitHub Release
#
# `release` runs last and needs no source checkout: it is pure artifact plus
# secrets. That ordering is the point — the image is on Docker Hub and the
# distribution is built BEFORE the Release exists, so the Release never links to
# a tarball or an image tag that was never produced.
#
# There is nothing left in this repo for `version` to pin — deployment is the
# installer's manifests, not this repo's. `image.yml` just builds and tags
# images at whatever ref it is given.
#
# Run once with push=false (dry run: runs the tests, computes the next version,
# and builds both the image and the package without pushing anything) then
# push=true to actually cut the release. A failed build after a successful tag
# strands a tag on a nonexistent image, which is exactly what the dry run buys.
#
# Auth for the version job: tokenless WIF → GCP Secret Manager → the kubed.io
# GitHub App creds. The App token is what lets version-bump commit to protected
# main and create the tag.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Version to bump to
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
        - premajor
        - preminor
        - prepatch
      push:
        description: Push changes and create release
        default: false
        type: boolean

# Least privilege by default. `version`, `wiki` and `release` opt up in their own
# blocks; nothing else writes anything or needs a GCP identity.
permissions:
  contents: read

jobs:

  # The compatibility sweep. Gates everything: a release is the one moment every
  # interpreter pyproject claims has to be verified, and the cheapest place to
  # find out otherwise is before a tag exists.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the rolled CHANGELOG and push the tag to main
      id-token: write   # GCP workload-identity federation, for the App token
    # Deliberately NO release-notes output. GitHub refuses to set a job output
    # whose value contains a registered secret, and the notes always contain
    # `kubed-io` — every PR link generated for this repo does — which is a
    # substring of a secret this workflow carries. The runner then logs
    # "Skip output 'release-notes' since it may contain secret" as a *warning*
    # and the job goes green with the output silently empty, which is how a
    # release ships with no notes at all. The notes travel as an artifact
    # instead: artifact contents are not masked.
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:

    - name: Validate Branch
      if: inputs.push
      env:
        REF: ${{ github.ref_name }}
      run: |
        if [[ "$REF" != "main" ]]; then
          echo "::error::Releases can only be pushed from main. Current ref: $REF"
          exit 1
        fi

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: github@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

    # github-app = kubed.io app creds (JSON: github_app_client_id /
    # github_app_private_key) pushed by apps/github/providers/gcp.
    - name: Get secrets
      id: secrets
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: |-
          github_app:${{ vars.GCP_PROJECT }}/github-app

    - name: Mint kubed.io app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ fromJson(steps.secrets.outputs.github_app).github_app_client_id }}
        private-key: ${{ fromJson(steps.secrets.outputs.github_app).github_app_private_key }}
        # Without a permission-* input the token carries every permission the
        # App is installed with; a commit and a push need contents alone.
        permission-contents: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    # One call, given the bump keyword. It computes the next version either way
    # and emits it, so a dry run (push: false) already answers "what would this
    # be" without a second invocation — and a second one fed its own `tag` back
    # in as `version` would be asking the action to parse a git tag as a semver,
    # which is not what that input is for.
    - name: Bump Version
      id: bump
      uses: duplocloud/version-bump@main
      with:
        version: ${{ inputs.action }}
        push: ${{ inputs.push }}
        token: ${{ steps.app-token.outputs.token }}

    # A step output is not subject to the job-output secret check, so the notes
    # are readable here even though they cannot be published as a job output.
    # Written to a file and carried on as an artifact.
    #
    # Empty is a hard failure, not a warning. These notes ARE the release —
    # rolling CHANGELOG [Unreleased] is the one thing this job exists to do —
    # and an empty body is exactly the kind of nothing that sails through a
    # green run and is only noticed by whoever reads the release later.
    - name: Save the Release Notes
      env:
        NOTES: ${{ steps.bump.outputs.release-notes }}
      run: |
        mkdir -p notes
        printf '%s\n' "$NOTES" > notes/release-notes.md
        if [[ ! -s notes/release-notes.md || -z "$(tr -d '[:space:]' < notes/release-notes.md)" ]]; then
          echo "::error::The release notes came back empty. The GitHub Release \
        would have no changelog, so this fails here rather than publishing one."
          exit 1
        fi
        echo "Release notes: $(wc -l < notes/release-notes.md) lines." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the Release Notes
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: notes/release-notes.md
        retention-days: 1

  # Build + push the image at the freshly tagged commit. On a dry run there is no
  # tag, so it builds the current ref without pushing (proves it still builds).
  image:
    name: Publish Image
    needs: version
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.push && needs.version.outputs.tag || '' }}
      push: ${{ inputs.push }}

  # Build the distribution at the freshly tagged commit, so the artifact the
  # Release carries was built from exactly the released tree. On a dry run there
  # is no tag, so it packages the current ref — which still proves it builds.
  package:
    name: Package
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.push && needs.version.outputs.tag || '' }}

  # Runs alongside `image`, not after it: three of the wiki's pages are generated
  # from the live config models, a live server's tool list and the OpenAPI
  # document, none of which has anything to do with the container, so serialising
  # them would only make the release slower. Deliberately NOT in `release`'s
  # needs — a wiki that fails to publish should not hold back an image that is
  # already on Docker Hub.
  #
  # It takes no `secrets:` because it needs none: wiki.yml reads GCP_WIF_PROVIDER
  # and GCP_PROJECT itself, and repository variables reach a called workflow in
  # the same repository without being passed.
  wiki:
    name: Publish Wiki
    needs: version
    if: inputs.push
    permissions:
      contents: write   # the wiki repo lives under this repository's permissions
      id-token: write   # GCP workload-identity federation, for the App token
    uses: ./.github/workflows/wiki.yml
    with:
      push: true
      tag: ${{ needs.version.outputs.tag }}

  release:
    name: Release
    needs:
    - version
    - image
    - package
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release on the existing tag
    steps:

    # No checkout: this job is pure artifact plus secrets. What it publishes is
    # the distribution the package job already built and tested, byte for byte.
    - name: Download Package
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.package.outputs.package }}
        path: dist

    - name: Download the Release Notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
        path: notes

    - name: Show Release Assets
      run: ls -l dist notes

    # Composed into a file rather than inlined into the action's `body:`, because
    # the notes cannot travel as a job output — see the `version` job. Everything
    # around them is static text about where to get what was just published.
    - name: Compose the Release Body
      env:
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        TAG: ${{ needs.version.outputs.tag }}
        WHEEL: ${{ needs.package.outputs.wheel }}
      run: |
        {
          echo "[![Publish](${SERVER}/${REPO}/actions/workflows/publish.yml/badge.svg)](${SERVER}/${REPO}/actions/runs/${RUN_ID})"
          echo "[![Image Builder](${SERVER}/${REPO}/actions/workflows/image.yml/badge.svg)](${SERVER}/${REPO}/actions/workflows/image.yml)"
          echo "[![Test](${SERVER}/${REPO}/actions/workflows/test.yml/badge.svg)](${SERVER}/${REPO}/actions/workflows/test.yml)"
          echo "[![Quality](${SERVER}/${REPO}/actions/workflows/quality.yml/badge.svg)](${SERVER}/${REPO}/actions/workflows/quality.yml)"
          echo
          cat notes/release-notes.md
          echo
          echo "## Container image"
          echo
          echo "The image is what this repo ships, and what a deployment runs:"
          echo
          echo '```sh'
          echo "docker pull kubed/mcp-kb:${TAG}"
          echo '```'
          echo
          echo "## Python package"
          echo
          echo "Not on PyPI. The wheel and sdist are attached to this release:"
          echo
          echo '```sh'
          echo "pip install ${SERVER}/${REPO}/releases/download/${TAG}/${WHEEL}"
          echo '```'
          echo
          echo "Or straight from the tag:"
          echo
          echo '```sh'
          echo "pip install git+${SERVER}/${REPO}.git@${TAG}"
          echo '```'
          echo
          echo "The manual is the [wiki](${SERVER}/${REPO}/wiki)."
        } > body.md
        cat body.md >> "$GITHUB_STEP_SUMMARY"

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        name: ${{ needs.version.outputs.tag }}
        tag_name: ${{ needs.version.outputs.tag }}
        prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        body_path: body.md
        files: |
          dist/${{ needs.package.outputs.sdist }}
          dist/${{ needs.package.outputs.wheel }}

    # The notes are already in the summary, printed by "Compose the Release
    # Body" — this is the what-shipped-where table that goes above them.
    - name: Summary
      env:
        TAG: ${{ needs.version.outputs.tag }}
        VERSION: ${{ needs.package.outputs.version }}
        WHEEL: ${{ needs.package.outputs.wheel }}
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        ## Publish

        - **Tag**: \`${TAG}\`
        - **Version**: \`${VERSION}\`
        - **Image**: \`kubed/mcp-kb:${TAG}\`
        - **Wheel**: \`${WHEEL}\`
        EOF
