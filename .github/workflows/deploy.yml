name: 🚀 Deploy

# Applies the app to the cluster with `kubectl up` (applyset + prune). Preview
# first with `kubectl plan .` locally.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Nothing here pushes — the deploy talks to the cluster, not to git.
        persist-credentials: false

    - name: KRM Setup
      uses: kubed-io/actions/krm-setup@main

    - name: Kluster Konnect
      uses: kubed-io/actions/kluster-konnect@main
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        project: ${{ vars.GCP_PROJECT }}

    - name: Kubectl
      uses: kubed-io/actions/kubectl@main
      with:
        cmd: up
