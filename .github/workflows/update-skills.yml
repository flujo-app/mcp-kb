name: 🧠 Update Skills

# Dependabot has no ecosystem for skills.toml, so this is its stand-in: repin
# every source to its upstream HEAD and open a PR with the diff.
#
# Deliberately a PR and not a direct commit — a skills bump is new upstream
# instruction content, which is exactly the kind of change that deserves a read
# before it ships. The changelog gate in pr.yml applies as normal.

on:
  schedule:
  # Mondays 09:00 UTC, matching the dependabot cadence.
  - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GCP workload-identity federation

jobs:
  update:
    name: Update Skills
    runs-on: ubuntu-latest
    steps:

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: github@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

    - name: Get secrets
      id: secrets
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: |-
          github_app:${{ vars.GCP_PROJECT }}/github-app

    # The default GITHUB_TOKEN cannot open PRs unless the org allows it, and a
    # PR it opens does not trigger other workflows. The app token does both.
    - name: Mint kubed.io app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ fromJson(steps.secrets.outputs.github_app).github_app_client_id }}
        private-key: ${{ fromJson(steps.secrets.outputs.github_app).github_app_private_key }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # --no-fetch: only the pins need rewriting here. image.yml does the real
    # fetch, and it is the thing that proves the new pins actually resolve.
    - name: Repin sources
      run: python scripts/fetch_skills.py --update --no-fetch

    - name: Open PR
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: skills/update
        title: 'deps(skills): repin skill sources'
        commit-message: 'deps(skills): repin skill sources'
        labels: |
          dependencies
          skills
        body: |
          Repins every source in `skills.toml` to its upstream `HEAD`.

          Each changed `ref` is new skill content that will ship in the next
          image build. Skim the upstream diffs before merging.

          Opened by `.github/workflows/update-skills.yml`.
