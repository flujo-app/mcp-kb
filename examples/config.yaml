# yaml-language-server: $schema=../config.schema.json
# The catalogue the image serves out of the box: four upstream skill packs as
# `github://` sources, pinned to commits and read straight from GitHub when the
# container starts. Copy this file, point it at your own sources, and mount it
# at /etc/mcp-kb/config.yaml.
#
# Each source is rooted at a repository root, and an `include` kind left unset
# falls back to the conventions — so `prompts: []` is what actually keeps an
# upstream's own `prompts/` out of this catalogue. Prompts live with the
# installation.
sources:
- name: n8n
  url: github://n8n-io/skills
  ref: 180b8415e3b73f78828cfa01e908e67f89f2a139
  include:
    skills: ["skills/*"]
    prompts: []
- name: grafana
  url: github://grafana/skills
  ref: 51d33e71e191b409bbd25fc7be2684c610d18166
  # Not `skills/*` like the others: this pack groups its skills a level deeper,
  # and naming the directory takes every skill under it whatever the depth.
  include:
    skills: ["skills"]
    prompts: []
- name: penpot
  url: github://penpot/penpot-ai-kit
  ref: c63d8e3717323fad859e794848e5a602b155a7ec
  include:
    skills: ["skills/*"]
    prompts: []
    # This pack's skills reference shared material from outside themselves, so
    # those directories are served at skill://penpot/<path>.
    files: ["shared/**/*", "workflows/**/*"]
- name: superpowers
  url: github://obra/superpowers
  ref: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
  include:
    skills: ["skills/*"]
    prompts: []

# A pinned ref never needs re-checking, which is why none of the above set
# `refresh:`. Track a branch instead and the server re-resolves it on that
# interval, rebuilding only if the commit moved:
#
# - name: superpowers-tip
#   url: github://obra/superpowers
#   ref: main
#   refresh: 1h
#   include:
#     skills: ["skills/*"]
#     prompts: []
