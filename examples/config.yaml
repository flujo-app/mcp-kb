# yaml-language-server: $schema=../config.schema.json
# The catalogue the image serves out of the box: four upstream skill libraries,
# each a marketplace published in a GitHub repository, pinned to a commit and
# read straight from GitHub when the container starts. Copy this file, point it
# at your own sources, and mount it at /etc/mcp-kb/config.yaml.
#
# `sources` names a backend once; a plugin or a library then addresses a path
# under it as `<source>://<path>[//<subdir>][?ref=<ref>]`. A library whose
# `source` is a marketplace takes its plugins from that repository's
# `marketplace.json`; a `plugins:` list adds beside it, and a plugin declared
# against the same repository shares its one clone.
sources:
- name: github
  url: git+https://github.com

plugins:
# penpot's skills reference shared material from outside themselves. A
# marketplace entry cannot say so, so a plugin of our own on the same
# repository serves those directories at skill://penpot/<path>.
- name: penpot-shared
  source: github://penpot/penpot-ai-kit?ref=c63d8e3717323fad859e794848e5a602b155a7ec
  skills: []
  prompts: []
  files: ["shared/**/*", "workflows/**/*"]

libraries:
- name: n8n
  description: Automation skills for n8n workflows.
  source: github://n8n-io/skills?ref=180b8415e3b73f78828cfa01e908e67f89f2a139
- name: grafana
  description: Observability skills — Grafana, Loki and friends.
  source: github://grafana/skills?ref=51d33e71e191b409bbd25fc7be2684c610d18166
- name: penpot
  description: Design skills for Penpot.
  source: github://penpot/penpot-ai-kit?ref=c63d8e3717323fad859e794848e5a602b155a7ec
  plugins: [penpot-shared]
- name: superpowers
  description: General-purpose engineering skills.
  source: github://obra/superpowers?ref=b36e0829c6d0140e93cfef2ca599b1b07d4a7797

# A pinned ref never needs re-checking, which is why the source above sets no
# `refresh:`. Track a branch instead and the server re-resolves it on that
# interval, rebuilding only if the commit moved:
#
# sources:
# - name: github
#   url: git+https://github.com
#   refresh: 1h
# libraries:
# - name: superpowers-tip
#   source: github://obra/superpowers?ref=main
