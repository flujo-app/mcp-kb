# yaml-language-server: $schema=http://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: mcp-school
  annotations:
    kubernetes.io/description: |
      MCP server that serves Agent Skills (SKILL.md packages) as MCP resources,
      bridged to tools so tool-only clients like n8n can read them.
      Deployed via plain Kubernetes manifests (no Helm).

buildMetadata:
- originAnnotations
- managedByLabel
- transformerAnnotations

# Lives with n8n: the agents that read these skills are the only consumers.
namespace: flow

labels:
- pairs:
    cluster.app: mcp-school
    app.kubernetes.io/name: mcp-school
    app.kubernetes.io/component: mcp
  includeSelectors: true
  includeTemplates: true

# newTag is written ONLY by publish.yml (kubed-io/actions/bump-image) and is
# always a semver. Point it at :main or :latest by hand to run something
# unreleased.
images:
- name: kubed/mcp-school
  newTag: "latest"

resources:
- deploy/deployment.yaml
- deploy/service.yaml
